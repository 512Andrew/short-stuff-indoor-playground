<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Short Stuff Indoor Playground | Coming Soon</title>
  <meta name="description" content="Short Stuff Indoor Playground is coming soon to San Marcos, Texas. A joyful place for children ages 1–12 to play, learn, and grow.">
  <meta name="robots" content="index,follow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect rx='18' width='64' height='64' fill='%236c39b6'/%3E%3Cpath d='M17 40c7 6 23 6 30-1' fill='none' stroke='%23fff' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='23' cy='25' r='4' fill='%23ffd128'/%3E%3Ccircle cx='41' cy='25' r='4' fill='%23ff4c96'/%3E%3C/svg%3E">
  <style>
    :root{--ink:#201849;--purple:#6836b5;--pink:#ef3f8b;--blue:#049be5;--lime:#8dca13;--gold:#ffc928;--aqua:#27bbc6;--soft:#faf8ff}
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{color:var(--ink);font-family:Nunito,sans-serif;background:var(--soft);font-size:16px;overflow-x:hidden}
    main{min-height:100vh;display:grid;place-items:center;position:relative;padding:48px 24px;isolation:isolate;background:radial-gradient(circle at 13% 12%,rgba(255,201,40,.2),transparent 27%),radial-gradient(circle at 87% 84%,rgba(39,187,198,.18),transparent 30%),linear-gradient(145deg,#fff 0%,#faf6ff 60%,#fff6fa 100%)}
    .arc{position:absolute;border:14px solid;border-color:var(--purple) transparent transparent var(--purple);width:420px;height:420px;border-radius:50%;opacity:.12;z-index:-1}.arc.one{left:-190px;top:-180px;transform:rotate(35deg)}.arc.two{right:-210px;bottom:-190px;transform:rotate(215deg);border-color:var(--pink) transparent transparent var(--pink)}
    .confetti{position:absolute;width:14px;height:14px;border-radius:50%;z-index:-1}.c1{background:var(--gold);left:10%;top:24%}.c2{background:var(--pink);right:12%;top:16%;width:22px;height:8px;border-radius:8px;transform:rotate(-25deg)}.c3{background:var(--blue);right:9%;bottom:24%}.c4{background:var(--lime);left:11%;bottom:19%;width:10px;height:28px;border-radius:8px;transform:rotate(25deg)}
    .card{width:min(760px,100%);text-align:center;background:rgba(255,255,255,.9);border:1px solid #e9e1f7;border-radius:42px;padding:clamp(34px,7vw,66px);box-shadow:0 28px 80px rgba(66,39,122,.16);backdrop-filter:blur(10px)}
    .logo{display:block;width:min(350px,78vw);height:auto;margin:0 auto 28px;filter:drop-shadow(0 13px 18px rgba(60,31,112,.12))}.eyebrow{display:inline-flex;align-items:center;gap:10px;color:var(--purple);font-size:.82rem;line-height:1;text-transform:uppercase;letter-spacing:.16em;font-weight:900}.eyebrow:before,.eyebrow:after{content:"";width:30px;height:3px;border-radius:99px;background:var(--gold)}
    h1{font:800 clamp(3.2rem,9vw,6.2rem)/.9 "Baloo 2",sans-serif;letter-spacing:-.045em;margin:18px 0 20px;color:var(--pink)}.lead{font-size:clamp(1.05rem,2.5vw,1.3rem);line-height:1.6;max-width:570px;margin:0 auto;color:#4e456c}
    .details{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin:30px 0}.pill{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:999px;background:#f2edfc;color:var(--purple);font-weight:900;font-size:.9rem}.pill:first-child{background:#eaf8cd;color:#497700}.contact{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;background:var(--ink);color:#fff;text-decoration:none;padding:13px 22px;font-weight:900;transition:transform .2s,box-shadow .2s}.contact:hover,.contact:focus-visible{transform:translateY(-2px);box-shadow:0 9px 0 rgba(32,24,73,.18)}
    footer{margin-top:28px;font-weight:800;color:#6f668a;font-size:.92rem}.dots{letter-spacing:.45em;color:var(--blue);margin-top:10px}.dots span:nth-child(2){color:var(--pink)}.dots span:nth-child(3){color:var(--lime)}.dots span:nth-child(4){color:var(--gold)}
    @media(max-width:560px){main{padding:24px 14px}.card{border-radius:30px;padding:34px 20px}.logo{margin-bottom:20px}.details{display:grid}.pill{justify-content:center}h1{font-size:3.7rem}}
  </style>
</head>
<body>
  <main><i class="arc one" aria-hidden="true"></i><i class="arc two" aria-hidden="true"></i><i class="confetti c1" aria-hidden="true"></i><i class="confetti c2" aria-hidden="true"></i><i class="confetti c3" aria-hidden="true"></i><i class="confetti c4" aria-hidden="true"></i>
    <section class="card" aria-labelledby="coming-soon-title"><img class="logo" src="assets/logo.png" alt="Short Stuff Indoor Playground - Play, Learn, Grow"><div class="eyebrow">Big fun is on the way</div><h1 id="coming-soon-title">Coming Soon!</h1><p class="lead">We’re creating a joyful indoor playground where children ages 1–12 can play, explore, celebrate, and grow.</p><div class="details"><span class="pill">San Marcos, Texas</span><span class="pill">Location to be announced</span></div><a class="contact" href="mailto:shortstuffdaycare@yahoo.com">Get in touch</a><footer>Short Stuff Indoor Playground<div class="dots" aria-hidden="true"><span>●</span><span>●</span><span>●</span><span>●</span></div></footer></section>
  </main>
</body>
</html>
